<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <title>Wedding Locations</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background: linear-gradient(135deg, #fff7f7, #f8f4ff);
      color: #333;
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 520px;
      background: rgba(255,255,255,.96);
      border-radius: 28px;
      padding: 34px 22px 28px;
      box-shadow: 0 12px 40px rgba(0,0,0,.10);
      text-align: center;
    }
    .rings { font-size: 44px; margin-bottom: 8px; }
    h1 {
      margin: 0 0 8px;
      font-size: 28px;
      font-weight: 700;
    }
    .subtitle {
      margin: 0 0 26px;
      color: #777;
      font-size: 16px;
    }
    .location {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 72px;
      margin: 14px 0;
      padding: 16px 20px;
      border-radius: 18px;
      text-decoration: none;
      color: #222;
      background: #fff;
      border: 1px solid #eee;
      box-shadow: 0 5px 16px rgba(0,0,0,.07);
      font-size: 19px;
      font-weight: 650;
      transition: transform .15s ease, box-shadow .15s ease;
    }
    .location:active {
      transform: scale(.98);
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }
    .icon {
      font-size: 28px;
      margin-right: 12px;
    }
    .footer {
      margin-top: 24px;
      font-size: 13px;
      color: #999;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="rings">💍</div>
    <h1>Wedding Locations</h1>
    <p class="subtitle">Επιλέξτε την τοποθεσία</p>

    <a class="location" href="https://maps.app.goo.gl/qtXcX7YEo8fuXZDn7?g_st=ic" target="_blank" rel="noopener">
      <span class="icon">🏠</span>
      <span>Σπίτι Γαμπρού</span>
    </a>

    <a class="location" href="https://maps.app.goo.gl/xa7s6EsJ6Un624n86?g_st=ic" target="_blank" rel="noopener">
      <span class="icon">🏠</span>
      <span>Σπίτι Νύφης</span>
    </a>

    <a class="location" href="https://maps.app.goo.gl/7sxEWdUUHL1YU8Yi9?g_st=ic" target="_blank" rel="noopener">
      <span class="icon">⛪</span>
      <span>Εκκλησία</span>
    </a>

    <div class="footer">Πατήστε την τοποθεσία που θέλετε να ανοίξετε στο Google Maps.</div>
  </main>
</body>
</html>
